# Server
server.port=8080

# Application
spring.application.name=agmarknet-api

# Database (H2 for development)
spring.datasource.url=jdbc:h2:mem:agmarknetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Load seed data
spring.sql.init.mode=always

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://market-tracking.vercel.app

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.agmarknet=INFO
